# hwmon-temps.conf — which hwmon chips the `hwmon-temps` anemos reports (read-only monitoring).
#
# One hwmon chip `name` per line; blank lines and `#` comments ignored. Installing this file
# unchanged is a no-op — when it is absent or empty the module uses the built-in default set shown
# below. List names explicitly to override the set (e.g. to add `acpitz`).
#
# Names are matched by PREFIX, so `r8169` catches `r8169_0_600:00` / `r8169_0_700:00`. Multiple
# chips sharing a name (e.g. four `spd5118` DIMMs) are disambiguated automatically in the labels
# (`spd5118@<addr>`). CPU (`coretemp`) is intentionally NOT here — it is reported by the `it87` fan
# module; NVMe is reported by the `nvme` module.

# Built-in default set (uncomment to pin, or edit to change):
# gigabyte_wmi   # board / VRM / chipset thermal sensors (vendor WMI view of the Super-I/O)
# spd5118        # DDR5 DIMM temperature sensors (one chip per module)
# r8169          # Realtek NIC temperature sensors (prefix-matched)

# it8689         # Super-I/O board sensors — off by default: same data as gigabyte_wmi (the it87
#                # fan module owns this chip). Add only if you want the raw chip view too.
# acpitz         # ACPI thermal zones — off by default (often duplicative/noisy); add to enable.
