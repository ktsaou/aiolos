# it87.conf — board wiring for the `it87` anemos (which hwmon chip, which PWM channels per zone).
#
# `key=value` per line; blank lines and `#` comments ignored. This maps THIS host's physical fan
# wiring (host-specific, like a curve), so the binary stays generic across ITE boards. Installing
# this file unchanged is a no-op — the values below are also the built-in defaults. Edit to match a
# different board, then `systemctl restart aiolos`.
#
# Channels are 1-based and correspond to `pwmN` / `fanN_input` on the chip's hwmon node.
# Zone mode (CPU zone vs case zone) is active only when BOTH it87.cpu.curve.json AND
# it87.case.curve.json hold a non-empty curve; otherwise it87.curve.json drives all channels.
# An enabled it87.case.policy.json adds source-matched curve demands to case channels using max;
# CPU channels and the existing uniform/zone baseline remain unchanged.

# chip=it8689   # hwmon `name` of the Super-I/O fan controller.
# cpu=1         # PWM channels driven by CPU temperature (coretemp) — the CPU cooler headers.
# case=3,4      # PWM channels driven by max(GPU, CPU) — the case intake/exhaust headers.
#
# KNOWN GIGABYTE LIMITATION (IT8689E): the board EC may ignore Linux PWM writes until you, in the
# BIOS (Smart Fan 5), set each header to **PWM** mode + **Manual** with a curve whose first point is
# 0% and the rest high (e.g. temps 40,40,…,100 / PWM 0,90,…,90). Without it, pwm writes read back
# but fans don't change. Some headers (often CPU_FAN) stay EC-locked even then — leave those out of
# `cpu=`/`case=` and let the BIOS run them. (On this workstation, IT8689E *rev 1*: only the case
# headers actually respond; the CPU_FAN header (pwm1) stays EC-locked — writes read back but the fan
# does not change. It is nonetheless listed in `cpu=1` by operator choice, so aiolos reports a
# commanded duty for it instead of the BIOS static 100%; the EC keeps running that fan regardless.)
