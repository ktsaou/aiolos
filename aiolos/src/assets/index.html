<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Aiolos · keeper of the winds</title>
<link rel="stylesheet" href="/aiolos.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ctext y='26' font-size='26'%3E%F0%9F%8C%AC%3C/text%3E%3C/svg%3E">
</head>
<body>
<!-- The Aegean vista: a sky of drifting winds above a horizon, a shimmering sea below.
     ambient heat-glow + a low sun/moon + wind currents + stars (night) + sea waves. No boxes. -->
<div class="sky" aria-hidden="true">
  <div class="aurora" id="aurora"></div>
  <svg id="wind" class="wind-bg" preserveAspectRatio="none"></svg>
  <div class="stars" id="stars"></div>
  <svg id="sea" class="sea-bg" preserveAspectRatio="none"></svg>
  <div class="horizon" id="horizon"></div>
</div>

<!-- the sun (day) / moon (night): an abstract gauge whose RING FILLS with the fleet's pressure
     (like a fan's duty arc), holding the number + "pressure" label. -->
<div class="celes" id="celes" title="fleet pressure — the strongest wind across the host">
  <svg class="celes-ic" viewBox="0 0 48 48" aria-hidden="true">
    <circle class="sun-fill" cx="24" cy="24" r="16.6"/>
    <circle class="track" cx="24" cy="24" r="18"/>
    <circle class="arc" cx="24" cy="24" r="18" transform="rotate(-90 24 24)"/>
    <text class="pnum-t" id="pnum" x="24" y="20.5">0</text>
    <text class="plabel" x="24" y="30.5">pressure</text>
  </svg>
</div>

<!-- Floating chrome: a wordmark, four lens-words (no sidebar), pressure, theme. -->
<header class="chrome">
  <div class="mark">AIOLOS<span class="mark-sub">keeper of the winds</span></div>
  <nav class="lenses" id="lenses">
    <button class="lens active" data-view="overview">Sky</button>
    <button class="lens" data-view="series">Flux</button>
    <button class="lens" data-view="curve">Law</button>
    <button class="lens" data-view="health">Pulse</button>
  </nav>
  <div class="chrome-right">
    <button id="theme" class="iconbtn" title="Toggle theme" aria-label="Toggle theme">☾</button>
    <span id="conn" class="conn ok">live</span>
  </div>
</header>

<main id="stage" class="stage"><div class="loading">Summoning the winds…</div></main>

<script src="/aiolos.js"></script>
</body>
</html>
