<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Aiolos · keeper of the winds</title>
<link rel="stylesheet" href="/aiolos.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ctext y='26' font-size='26'%3E%F0%9F%8C%AC%3C/text%3E%3C/svg%3E">
</head>
<body>
<!-- The open sky: ambient heat-glow + drifting wind currents + faint stars. No boxes. -->
<div class="sky" aria-hidden="true">
  <div class="aurora" id="aurora"></div>
  <svg id="wind" class="wind-bg" preserveAspectRatio="xMidYMid slice"></svg>
  <div class="stars" id="stars"></div>
</div>

<!-- Floating chrome: a wordmark, four lens-words (no sidebar), pressure, theme. -->
<header class="chrome">
  <div class="mark">AIOLOS<span class="mark-sub">keeper of the winds</span></div>
  <nav class="lenses" id="lenses">
    <button class="lens active" data-view="overview">Sky</button>
    <button class="lens" data-view="series">Flux</button>
    <button class="lens" data-view="curve">Law</button>
    <button class="lens" data-view="health">Pulse</button>
  </nav>
  <div class="chrome-right">
    <span class="pressure-mini" title="Fleet pressure — the strongest wind across the host">
      <span id="pnum">–</span><i>pressure</i>
    </span>
    <button id="theme" class="iconbtn" title="Toggle theme" aria-label="Toggle theme">☾</button>
    <span id="conn" class="conn ok">live</span>
  </div>
</header>

<main id="stage" class="stage"><div class="loading">Summoning the winds…</div></main>

<script src="/aiolos.js"></script>
</body>
</html>
